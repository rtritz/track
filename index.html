<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Park Tudor Track & Field</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Oswald:wght@500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Oswald:wght@500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: light;
      --brand: #c63527;
      --brand-deep: #95271a;
      --brand-soft: #f7eeec;
      --gold: #d7b76c;
      --ink: #20252b;
      --muted: #66707a;
      --surface: #ffffff;
      --page: #f1f2f2;
      --border: #e1e4e6;
      --shadow: 0 8px 26px rgba(24, 32, 38, 0.055);
    }

    body {
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: 'Open Sans', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -webkit-overflow-scrolling: touch;
    }

    /* ── HERO ── */
    header {
      position: relative;
      padding: clamp(42px, 6vw, 66px) 24px;
      background: var(--brand);
      color: #fff;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
    }

    header h1 {
      max-width: 900px;
      margin: 0 auto;
      color: #fff;
      font-family: 'Libre Baskerville', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.045em;
      line-height: 1.2;
      text-align: center;
    }

    /* ── PAGE LAYOUT ── */
    main {
      position: relative;
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 24px 64px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "absence" "documents" "links";
      gap: 18px;
    }

    /* ── CARDS ── */
    .card {
      min-width: 0;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 3px 16px rgba(24, 32, 38, 0.045);
    }

    .absence-card { grid-area: absence; }

    .links-card { grid-area: links; }
    .documents-card { grid-area: documents; }

    .card-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 18px;
      padding: 0 0 14px;
      border-bottom: 1px solid var(--border);
    }

    .card-title {
      color: var(--ink);
      font-family: 'Oswald', sans-serif;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.015em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .card-body { padding: 0; }

    /* ── ABSENCE FORM ── */
    .btn-absence {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      border: 1px solid var(--brand);
      border-radius: 7px;
      background: var(--brand);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.035em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }

    .btn-absence:hover {
      transform: translateY(-2px);
      background: var(--brand-deep);
      box-shadow: 0 8px 18px rgba(149, 39, 26, 0.22);
    }

    .btn-absence svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── LINKS ── */
    .links-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 18px;
      list-style: none;
    }

    .link-row {
      display: grid;
      min-height: 78px;
      grid-template-columns: 30px minmax(0, 1fr) 16px;
      align-items: center;
      gap: 10px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
      color: var(--ink);
      text-decoration: none;
      transition: color 160ms ease, background 160ms ease;
    }

    .link-row:hover {
      background: #fbf8f7;
      color: var(--brand-deep);
    }

    .link-icon-wrap {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 7px;
      background: transparent;
    }

    .link-icon-wrap svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--brand);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.7;
    }

    .link-text {
      display: flex;
      min-width: 0;
      flex: 1;
      flex-direction: column;
    }

    .link-label {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.015em;
    }

    .link-arrow {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      fill: none;
      opacity: 0.55;
      stroke: var(--brand);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .link-row:hover .link-arrow {
      transform: translateX(3px);
      opacity: 1;
    }

    /* ── DRIVE EMBED ── */
    .drive-wrapper {
      height: 440px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #faf9f7;
    }

    .drive-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ── FOOTER ── */
    footer {
      padding: 22px 24px 30px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    a:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    @media (max-width: 760px) {
      header { padding: 42px 20px; }
      main { padding: 22px 16px 44px; }
      .dashboard {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "absence" "documents" "links";
        gap: 16px;
      }
      .card { padding: 20px; border-radius: 10px; }
      .drive-wrapper { height: 400px; }
    }

    @media (max-width: 520px) {
      .links-list { grid-template-columns: 1fr; }
    }

    @media (max-width: 420px) {
      .card { padding: 18px; }
      .link-row { gap: 9px; padding: 11px 2px; }
      .btn-absence { width: 100%; }
      .drive-wrapper { height: 360px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="hero-inner">
      <h1>Park Tudor Track &amp; Field</h1>
    </div>
  </header>

  <main>
    <div class="dashboard">

    <!-- ABSENCE FORM -->
    <section class="card absence-card" aria-labelledby="absence-title">
      <div class="card-heading">
        <div>
          <h2 class="card-title" id="absence-title">Absence Form</h2>
        </div>
      </div>
      <div class="card-body">
        <a class="btn-absence" href="https://tally.so/r/w8YArP" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Submit Absence Form
        </a>
      </div>
    </section>

    <!-- DOCUMENTS / GOOGLE DRIVE -->
    <section class="card documents-card" aria-labelledby="documents-title">
      <div class="card-heading">
        <div>
          <h2 class="card-title" id="documents-title">Documents</h2>
        </div>
      </div>
      <div class="card-body">
        <div class="drive-wrapper">
          <iframe
            class="drive-frame"
            src="https://drive.google.com/embeddedfolderview?authuser=0&id=17KB069VaRQN1pIinZlS2f7CO1pPMWQjH#list"
            width="100%"
            height="400"
            allowfullscreen
            loading="lazy"
            importance="low"
            title="Track Share Drive Folder"
            sandbox="allow-scripts allow-popups allow-forms allow-same-origin allow-popups-to-escape-sandbox allow-downloads"
          ></iframe>
        </div>
      </div>
    </section>

    <!-- LINKS -->
    <section class="card links-card" aria-labelledby="links-title">
      <div class="card-heading">
        <div>
          <h2 class="card-title" id="links-title">Quick Links</h2>
        </div>
      </div>
      <div class="card-body">
        <ul class="links-list">
          <li>
            <a class="link-row" href="https://www.parktudor.org/athletics/teams-schedules/track-field" target="_blank" rel="noopener noreferrer">
              <span class="link-icon-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </span>
              <span class="link-text">
                <span class="link-label">Meet Schedule</span>
              </span>
              <svg class="link-arrow" viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
          </li>
          <li>
            <a class="link-row" href="https://www.athletic.net/team/17001/track-and-field-indoor/2026" target="_blank" rel="noopener noreferrer">
              <span class="link-icon-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M17 3H7l1 9a4 4 0 0 0 8 0l1-9z"/><path d="M7 3H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4M17 3h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"/></svg>
              </span>
              <span class="link-text">
                <span class="link-label">Meet Results</span>
              </span>
              <svg class="link-arrow" viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
          </li>
        </ul>
      </div>
    </section>
    </div>

  </main>

  <footer>
    &copy; Park Tudor Track and Field
  </footer>

</body>
</html>
